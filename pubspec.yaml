
name: fast_location
description: "Aplicativo FastLocation - Consulta e histórico de endereços."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Comunicação com a API ViaCEP
  dio: ^5.11.1

  # Gerenciamento de estado
  mobx: ^2.7.0
  flutter_mobx: ^2.4.0

  # Armazenamento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navegação e localização
  url_launcher: ^6.3.3
  map_launcher: ^7.0.0
  geocoding: ^5.0.1

  # Caminhos e armazenamento
  path: ^1.9.1
  path_provider: ^2.1.6
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Geração de código
  mobx_codegen: 2.7.3
  hive_generator_plus: 5.0.0
  build_runner: 2.7.1

flutter:
  uses-material-design: true
